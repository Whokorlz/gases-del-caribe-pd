services:
  # 1. Base de Datos PostgreSQL
  postgres_db:
    image: postgres:15-alpine
    container_name: postgres_db_gases_del_caribe
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-gases_del_caribe}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 8s
      retries: 5
    networks:
      - app-network

  # 2. Backend (Node.js/Express/TS)
  backend:
    build:
      context: .
      dockerfile: ./packages/backend/Dockerfile.dev
    container_name: backend
    volumes:
      - ./packages/backend:/app
      - /app/node_modules
    ports:
      - "${BACKEND_PORT:-3001}:3000"
    environment:
      - NODE_ENV=development
      - DB_HOST=postgres_db
      - DB_PORT=${POSTGRES_PORT:-5432}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_NAME=${POSTGRES_DB:-gases_del_caribe}
      - JWT_SECRET=${JWT_SECRET:-your_jwt_secret_key}
    depends_on:
      postgres_db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 8s
      retries: 5
    networks:
      - app-network

  # 3. Frontend
  frontend:
    build:
      context: .
      dockerfile: ./packages/frontend/Dockerfile.dev
    container_name: frontend
    volumes:
      - ./packages/frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=development
      - REACT_APP_API_URL=http://localhost:${BACKEND_PORT:-3001}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data: